[package]
name = "morinume"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Morinume: the Morizen mods menu (official)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { git = "https://github.com/its-Kobi/Morizen", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Morinume
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Morinume

      - name: Tests (host build of the same code)
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo horizon-mod
        run: cargo install --git https://github.com/its-Kobi/Morizen --branch main cargo-horizon-mod --locked

      - name: Build the .hmod
        run: cargo horizon-mod build

      - name: Check the .hmod
        run: cargo horizon-mod check target/horizon-mod/morinume.hmod

      - uses: actions/upload-artifact@v4
        with:
          name: morinume
          path: Morinume/target/horizon-mod/morinume.hmod
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Morinume/target/horizon-mod/morinume.hmod
